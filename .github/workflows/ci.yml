name: Android CI (API 35 Build, JVM Unit Tests & Release)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-ci:
    name: Build Android APK/AAB & Run JVM Unit Tests (API 35)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Platform 35, Build-Tools 35.0.0, Kotlin 2.0.21 & Bundletool
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          mkdir -p "$SDK_ROOT/bundletool"
          curl -sSL https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar \
            -o "$SDK_ROOT/bundletool/bundletool.jar"
          rm -rf /tmp/kotlinc /tmp/kotlin.zip
          curl -sSL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          echo "KOTLIN_HOME=/tmp/kotlinc" >> $GITHUB_ENV

      - name: Lint Shell & Python Scripts
        run: |
          bash -n scripts/build-and-test.sh
          python3 -m py_compile tests/emulator-e2e.test.py scripts/generate-store-assets.py

      - name: Enforce Release Keystore on Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "[ERROR] RELEASE_KEYSTORE_BASE64 secret is required for version tag releases to prevent ephemeral key signing!"
            exit 1
          fi

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keys
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keys/release.jks
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASS=${{ secrets.RELEASE_KEY_PASS }}" >> $GITHUB_ENV

      - name: Execute Kotlin Build (-Werror), JVM Unit Tests & Bundletool Validation
        run: |
          ./scripts/build-and-test.sh

      - name: Upload Release APK & Play Store AAB Artifacts (Internal CI)
        uses: actions/upload-artifact@v6
        with:
          name: tapink-release-bundles
          path: |
            android/app/build/tapink-release.aab
            android/app/build/tapink-release.apk
            android/app/build/tapink.apk
            android/app/build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Sync Actual APK SHA-256 into Release Notes
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('docs/RELEASE_NOTES.md') != ''
        run: |
          ACTUAL_SHA=$(awk '{print $1}' android/app/build/SHA256SUMS.txt)
          sed -i "s/[0-9a-f]\{64\}/$ACTUAL_SHA/g" docs/RELEASE_NOTES.md

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/RELEASE_NOTES.md
          files: |
            android/app/build/tapink-release.apk
            android/app/build/SHA256SUMS.txt
          generate_release_notes: false
