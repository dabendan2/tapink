name: Cross-Platform CI (Android API 35 & iOS CoreNFC)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-ci:
    name: Build Android APK/AAB & Run JVM Unit Tests (API 35)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 35 & Build-Tools 35.0.0)
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35, Build-Tools 35.0.0, Kotlin & Bundletool
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          mkdir -p "$ANDROID_SDK_ROOT/bundletool"
          curl -sSL https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar \
            -o "$ANDROID_SDK_ROOT/bundletool/bundletool.jar"
          if ! command -v kotlinc >/dev/null 2>&1; then
            curl -sSL https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip -o /tmp/kotlin.zip
            unzip -q /tmp/kotlin.zip -d /tmp
            echo "KOTLIN_HOME=/tmp/kotlinc" >> $GITHUB_ENV
          else
            KOTLIN_BIN="$(readlink -f "$(command -v kotlinc)")"
            KOTLIN_HOME_DIR="$(dirname "$(dirname "$KOTLIN_BIN")")"
            echo "KOTLIN_HOME=$KOTLIN_HOME_DIR" >> $GITHUB_ENV
          fi

      - name: Lint Shell & Python Scripts
        run: |
          bash -n scripts/build-and-test.sh
          python3 -m py_compile tests/emulator-e2e.test.py scripts/generate-store-assets.py

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keys
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keys/release.jks
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASS=${{ secrets.RELEASE_KEY_PASS }}" >> $GITHUB_ENV

      - name: Execute Kotlin Build (-Werror), JVM Unit Tests & Bundletool Validation
        run: |
          ./scripts/build-and-test.sh

      - name: Upload Release APK & Play Store AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapink-release-bundles
          path: |
            android/app/build/tapink-release.aab
            android/app/build/tapink-release.apk
            android/app/build/tapink.apk
          if-no-files-found: error

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/tapink-release.aab
            android/app/build/tapink-release.apk
          generate_release_notes: true

  ios-core-linux-ci:
    name: Run iOS TapInkCore Swift Unit Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build & Execute TapInkCore XCTest Suite
        run: |
          cd ios
          swift test -v

  ios-xcode-ci:
    name: Build iOS App & Share Extension via XcodeGen (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run TapInkCore Swift Package Tests on macOS
        run: |
          cd ios
          swift test

      - name: Install XcodeGen & Generate TapInk.xcodeproj
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Build TapInkApp & TapInkShareExtension for iOS Simulator (Unsigned)
        run: |
          cd ios
          xcodebuild \
            -project TapInk.xcodeproj \
            -scheme TapInkApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
